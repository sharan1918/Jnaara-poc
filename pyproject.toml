[project]
name = "jnaara"
version = "0.1.0"
description = "Deterministic belief engine with LLM-powered semantic analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-google-genai>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
jnaara = "jnaara.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jnaara"]

